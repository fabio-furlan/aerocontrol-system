spring.application.name=fb-aerocontrol-mro-api
# Perfil padrao para rodar localmente; em producao use SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev
server.port=${PORT:8081}

# JPA: a estrutura do banco e criada somente pelo Flyway; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migracoes comuns + especificas do banco em uso (h2 ou postgresql)
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

# Token de acesso (JWT)
app.jwt.issuer=fb-aerocontrol-mro
app.jwt.expiration-hours=8

# Origens autorizadas a chamar a API (separadas por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload da foto da aeronave (o limite de 5 MB por foto é validado também no servico)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
