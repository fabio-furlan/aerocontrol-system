# Desenvolvimento local: H2 gravado em arquivo (./data), em modo compativel com PostgreSQL
spring.datasource.url=jdbc:h2:file:./data/aerocontrol;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Chave apenas para desenvolvimento. Em producao, JWT_SECRET e obrigatoria.
app.jwt.secret=${JWT_SECRET:dev-only-secret-troque-em-producao}

# Usuarios de demonstracao (um por perfil)
app.seed.demo-users=true
app.seed.demo-password=${DEMO_PASSWORD:Demo@2026}
