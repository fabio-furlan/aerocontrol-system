# Producao: PostgreSQL (Neon, Supabase, Render...). Todas as credenciais vem de variaveis de ambiente.
# Ex.: DATABASE_URL=jdbc:postgresql://host:5432/aerocontrol?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

app.jwt.secret=${JWT_SECRET}

# Para o portfolio, habilite SEED_DEMO_USERS=true e defina DEMO_PASSWORD
app.seed.demo-users=${SEED_DEMO_USERS:false}
app.seed.demo-password=${DEMO_PASSWORD:}

# Respeita X-Forwarded-For atras do proxy da hospedagem (IP real no log de auditoria)
server.forward-headers-strategy=framework
